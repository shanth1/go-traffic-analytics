basePath: /
definitions:
  domain.Campaign:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      user_id:
        type: string
    type: object
  domain.CategoryStat:
    properties:
      name:
        type: string
      share:
        description: Percentage of total (optional, can be calculated on frontend)
        type: number
      value:
        type: integer
    type: object
  domain.GeoStat:
    properties:
      country:
        type: string
      value:
        type: integer
    type: object
  domain.HeatmapPoint:
    properties:
      count:
        description: Color intensity
        type: integer
      day:
        description: 0=Sun, 1=Mon, ..., 6=Sat
        type: integer
      hour:
        description: 0-23
        type: integer
    type: object
  domain.HierarchyNode:
    properties:
      children:
        items:
          $ref: '#/definitions/domain.HierarchyNode'
        type: array
      name:
        type: string
      type:
        description: '"root", "campaign", "link"'
        type: string
      value:
        description: E.g., clicks (optional)
        type: integer
    type: object
  domain.Link:
    properties:
      campaign_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      slug:
        type: string
      target_url:
        type: string
      user_id:
        type: string
    type: object
  domain.Plan:
    properties:
      can_export_data:
        type: boolean
      description:
        type: string
      id:
        description: e.g., "free", "pro"
        type: string
      is_active:
        type: boolean
      max_clicks_month:
        type: integer
      max_links:
        description: -1 for infinity
        type: integer
      name:
        description: '"Starter", "Professional"'
        type: string
      price_cents:
        description: 0, 990, 4990
        type: integer
    type: object
  domain.SankeyData:
    properties:
      links:
        items:
          $ref: '#/definitions/domain.SankeyLink'
        type: array
      nodes:
        items:
          $ref: '#/definitions/domain.SankeyNode'
        type: array
    type: object
  domain.SankeyLink:
    properties:
      source:
        type: string
      target:
        type: string
      value:
        type: integer
    type: object
  domain.SankeyNode:
    properties:
      id:
        description: Node name (e.g., "USA" or "Mobile")
        type: string
      layer:
        description: Column (0 - Referer, 1 - Device...)
        type: integer
    type: object
  domain.Summary:
    properties:
      top_browsers:
        items:
          $ref: '#/definitions/domain.CategoryStat'
        type: array
      top_os:
        items:
          $ref: '#/definitions/domain.CategoryStat'
        type: array
      total_clicks:
        type: integer
    type: object
  domain.TrafficQuality:
    properties:
      bot_score:
        type: integer
      geo_diversity_score:
        type: integer
      human_score:
        type: integer
      is_suspicious:
        type: boolean
      mobile_friendly_score:
        type: integer
    type: object
  domain.User:
    properties:
      clicks_current_month:
        type: integer
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      plan_expires:
        description: nil = forever (for free)
        type: string
      plan_id:
        type: string
      role:
        $ref: '#/definitions/domain.UserRole'
    type: object
  domain.UserRole:
    enum:
    - admin
    - client
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleClient
  handlers.HealthResponse:
    properties:
      status:
        example: OK
        type: string
    type: object
  response.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  v1.AnalyticsSummaryResponse:
    properties:
      data:
        $ref: '#/definitions/domain.Summary'
    type: object
  v1.CampaignResponse:
    properties:
      data:
        $ref: '#/definitions/domain.Campaign'
    type: object
  v1.CampaignsListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.Campaign'
        type: array
    type: object
  v1.CreateCampaignRequest:
    properties:
      name:
        example: My Campaign
        type: string
    required:
    - name
    type: object
  v1.CreateLinkRequest:
    properties:
      campaign_id:
        type: string
      target_url:
        example: https://google.com
        type: string
    required:
    - target_url
    type: object
  v1.GeoResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.GeoStat'
        type: array
    type: object
  v1.HeatmapResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.HeatmapPoint'
        type: array
    type: object
  v1.LinkResponse:
    properties:
      data:
        $ref: '#/definitions/domain.Link'
    type: object
  v1.LinksListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.Link'
        type: array
    type: object
  v1.LoginData:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/domain.User'
    type: object
  v1.LoginReq:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: secret123
        type: string
    required:
    - email
    - password
    type: object
  v1.LoginResponse:
    properties:
      data:
        $ref: '#/definitions/v1.LoginData'
    type: object
  v1.PlansListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.Plan'
        type: array
    type: object
  v1.ProfileTreeResponse:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/domain.HierarchyNode'
        description: Предпологаем, что HierarchyNode определен в domain
    type: object
  v1.QualityResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.TrafficQuality'
        type: array
    type: object
  v1.RegisterReq:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: secret123
        type: string
    required:
    - email
    - password
    type: object
  v1.RegisterResponse:
    properties:
      data:
        $ref: '#/definitions/domain.User'
    type: object
  v1.SankeyResponse:
    properties:
      data:
        $ref: '#/definitions/domain.SankeyData'
    type: object
  v1.StatsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.CategoryStat'
        type: array
    type: object
  v1.StatusData:
    properties:
      status:
        example: updated
        type: string
    type: object
  v1.StatusResponse:
    properties:
      data:
        $ref: '#/definitions/v1.StatusData'
    type: object
  v1.StreamGraphResponse:
    properties:
      data:
        description: Предполагаем тип возвращаемого значения сервиса
        items:
          additionalProperties: {}
          type: object
        type: array
    type: object
  v1.UpdateUserPlanReq:
    properties:
      plan_id:
        example: plan_pro
        type: string
    required:
    - plan_id
    type: object
  v1.UpdateUserStatusReq:
    properties:
      is_active:
        example: true
        type: boolean
    type: object
  v1.UsersListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.User'
        type: array
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Traffic analytics service
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Traffic Analytics
  version: "1.0"
paths:
  /{slug}:
    get:
      description: Redirect user to target URL based on slug
      parameters:
      - description: Short Link Slug
        in: path
        name: slug
        required: true
        type: string
      responses:
        "307":
          description: Temporary Redirect
          schema:
            type: string
        "404":
          description: Link not found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Redirect link
      tags:
      - Redirect
  /api/v1/admin/users:
    get:
      description: Get paginated users list (Admin). Returns array wrapped in data.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.UsersListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - Admin
  /api/v1/admin/users/{id}/plan:
    patch:
      consumes:
      - application/json
      description: Set new plan for user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Plan Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateUserPlanReq'
      produces:
      - application/json
      responses:
        "200":
          description: 'Status: updated'
          schema:
            $ref: '#/definitions/v1.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change user plan
      tags:
      - Admin
  /api/v1/admin/users/{id}/status:
    patch:
      consumes:
      - application/json
      description: Activate/Deactivate user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Status Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateUserStatusReq'
      produces:
      - application/json
      responses:
        "200":
          description: 'Status: updated'
          schema:
            $ref: '#/definitions/v1.StatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user status
      tags:
      - Admin
  /api/v1/analytics/flow:
    get:
      description: Get flow data (Referer -> Device -> Country)
      parameters:
      - description: Filter by Campaign
        in: query
        name: campaign_id
        type: string
      - description: Filter by Link
        in: query
        name: link_id
        type: string
      - description: Date From (RFC3339)
        in: query
        name: from
        type: string
      - description: Date To (RFC3339)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.SankeyResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Sankey flow
      tags:
      - Analytics
  /api/v1/analytics/geo:
    get:
      description: Get clicks count by country
      parameters:
      - description: Filter by Campaign
        in: query
        name: campaign_id
        type: string
      - description: Filter by Link
        in: query
        name: link_id
        type: string
      - description: Date From (RFC3339)
        in: query
        name: from
        type: string
      - description: Date To (RFC3339)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.GeoResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Geo distribution
      tags:
      - Analytics
  /api/v1/analytics/heatmap:
    get:
      description: Get click intensity by Day of Week and Hour
      parameters:
      - description: Filter
        in: query
        name: campaign_id
        type: string
      - description: Filter
        in: query
        name: link_id
        type: string
      - description: Date From (RFC3339)
        in: query
        name: from
        type: string
      - description: Date To (RFC3339)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.HeatmapResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Heatmap data
      tags:
      - Analytics
  /api/v1/analytics/quality:
    get:
      description: Get quality metrics for Radar Chart
      parameters:
      - description: Filter by Campaign
        in: query
        name: campaign_id
        type: string
      - description: Filter by Link
        in: query
        name: link_id
        type: string
      - description: Date From (RFC3339)
        in: query
        name: from
        type: string
      - description: Date To (RFC3339)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.QualityResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Traffic quality
      tags:
      - Analytics
  /api/v1/analytics/stats:
    get:
      description: Get top metrics for a dimension (browser, os, device)
      parameters:
      - default: browser
        description: browser, os, device
        in: query
        name: dimension
        type: string
      - description: Filter by Campaign
        in: query
        name: campaign_id
        type: string
      - description: Filter by Link
        in: query
        name: link_id
        type: string
      - description: Date From (RFC3339)
        in: query
        name: from
        type: string
      - description: Date To (RFC3339)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.StatsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Category Stats (Pie/Bar)
      tags:
      - Analytics
  /api/v1/analytics/stream:
    get:
      description: Get time-series data for Streamgraph/Stacked Area charts
      parameters:
      - default: os
        description: os, browser, country
        in: query
        name: group_by
        type: string
      - description: Filter by Campaign
        in: query
        name: campaign_id
        type: string
      - description: Filter by Link
        in: query
        name: link_id
        type: string
      - description: Date From (RFC3339)
        in: query
        name: from
        type: string
      - description: Date To (RFC3339)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.StreamGraphResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Stream graph data
      tags:
      - Analytics
  /api/v1/analytics/summary:
    get:
      description: Get aggregated stats (clicks, uniques, etc.)
      parameters:
      - description: Filter by Campaign
        in: query
        name: campaign_id
        type: string
      - description: Filter by Link
        in: query
        name: link_id
        type: string
      - description: Date From (RFC3339)
        in: query
        name: from
        type: string
      - description: Date To (RFC3339)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.AnalyticsSummaryResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Analytics summary
      tags:
      - Analytics
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate and get JWT token
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: Token and User info
          schema:
            $ref: '#/definitions/v1.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Login user
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user account
      parameters:
      - description: Registration info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.RegisterReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created user data
          schema:
            $ref: '#/definitions/v1.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Missing authorization header
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Email already taken
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Register new user
      tags:
      - Auth
  /api/v1/billing/plans:
    get:
      description: Get all available plans
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.PlansListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: List plans
      tags:
      - Billing
  /api/v1/campaigns:
    get:
      description: Get list of user campaigns
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.CampaignsListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get campaigns
      tags:
      - Campaigns
    post:
      consumes:
      - application/json
      description: Create a new campaign
      parameters:
      - description: Campaign Name
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.CreateCampaignRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1.CampaignResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create campaign
      tags:
      - Campaigns
  /api/v1/links:
    get:
      description: Get links with filtering, search and pagination
      parameters:
      - description: Filter by Campaign ID
        in: query
        name: campaign_id
        type: string
      - description: Search by slug or target URL
        in: query
        name: search
        type: string
      - description: Filter by active status
        in: query
        name: is_active
        type: boolean
      - description: Limit (default 10)
        in: query
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.LinksListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get links list
      tags:
      - Links
    post:
      consumes:
      - application/json
      description: Shorten a URL
      parameters:
      - description: Link Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.CreateLinkRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1.LinkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Limit reached or Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create link
      tags:
      - Links
