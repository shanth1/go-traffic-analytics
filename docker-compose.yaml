version: '3.8'

services:
  app:
    build: .
    ports:
      - '${APP_PORT:-8080}:8080'
    env_file:
      - .env
    environment:
      - ENV=prod
    volumes:
      - ./config:/root/config
      - ./database:/root/database
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: timescale/timescaledb:latest-pg16
    ports:
      - '${DB_PORT:-5432}:5432'
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - app-network

  frontend:
    build: ./frontend
    ports:
      - '${FRONTEND_PORT:-80}:80'
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
